<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cashback</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page">
        <section class="container">
            <h1>Sistema de Cashback</h1>
            <p class="subtitle">Informe os dados da compra para calcular o cashback.</p>

            <div class="form-group">
                <label for="valor">Valor da compra</label>
                <input id="valor" type="number" placeholder="Ex: 600">
            </div>

            <div class="form-group">
                <label for="desconto">Desconto de cupom - opcional (%)</label>
                <input id="desconto" type="number" placeholder="Ex: 20">
            </div>

            <div class="checkbox-group">
                <label for="vip">Cliente VIP</label>
                <input type="checkbox" id="vip">
            </div>

            <div class="button-group">
                <button onclick="calcular()">Calcular Cashback</button>
                <button onclick="verHistorico()">Ver Histórico</button>
            </div>

            <div class="result-box">
                <h2>Resultado</h2>
                <p id="resultado">Nenhum cálculo realizado ainda.</p>
            </div>

            <div class="history-box">
                <h2>Histórico</h2>
                <div id="historico-lista" class="history-content">
                    Nenhum histórico carregado.
                </div>
            </div>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
