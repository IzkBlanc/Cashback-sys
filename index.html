<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cashback</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <h2>Calculadora de Cashback</h2>

    <div>
        <label for="valor">Valor da compra:</label><br>
        <input id="valor" type="number" placeholder="Ex: 600">
    </div>

    <br>

    <div>
        <label for="desconto">Desconto (%):</label><br>
        <input id="desconto" type="number" placeholder="Ex: 20">
    </div>

    <br>

    <div>
        <label for="vip">
            Cliente VIP:
            <input type="checkbox" id="vip">
        </label>
    </div>

    <br>

    <button onclick="calcular()">Calcular Cashback</button>
    <button onclick="verHistorico()">Ver Histórico</button>

    <h3>Resultado:</h3>
    <p id="resultado"></p>

    <script src="/script.js"></script>
</body>
</html>
